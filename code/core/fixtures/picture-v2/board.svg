<svg viewBox="0 0 320 240" fill="none" stroke="var(--ink)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><defs><g id="board"><rect width="80" height="80"/><path d="M 20 0 V 80 M 40 0 V 80 M 60 0 V 80 M 0 20 H 80 M 0 40 H 80 M 0 60 H 80"/></g><g id="queen"><circle cx="10" cy="10" r="6" fill="var(--voice)"/></g></defs><text x="18" y="20" fill="var(--ink)">Try, then undo</text><g data-step="1" data-caption="Place the first queen"><use href="#board" x="18" y="40"/><use href="#queen" x="18" y="40"/></g><g data-step="2" data-hide="1" data-caption="Try a second queen"><use href="#board" x="18" y="40"/><use href="#queen" x="18" y="40"/><use href="#queen" x="38" y="60"/></g><g data-step="3" data-hide="2" data-caption="Undo the conflicting queen"><use href="#board" x="18" y="40"/><use href="#queen" x="18" y="40"/></g></svg>
