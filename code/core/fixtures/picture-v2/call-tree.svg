<svg viewBox="0 0 320 220" font-family="var(--font-sans)" font-size="14"><text x="18" y="20">A repeated call</text><g data-step="1" data-caption="Split into two calls"><path d="M 160 50 L 80 100 M 160 50 L 240 100" fill="none" stroke="var(--soft)"/><text x="160" y="42" text-anchor="middle">fib(4)</text><text x="80" y="120" text-anchor="middle">fib(3)</text><text x="240" y="120" text-anchor="middle">fib(2)</text></g><g data-step="2" data-caption="Expand the left call" data-dim="1"><path d="M 80 130 L 40 170 M 80 130 L 120 170" fill="none" stroke="var(--voice)"/><text x="40" y="190" text-anchor="middle">fib(2)</text><text x="120" y="190" text-anchor="middle">fib(1)</text></g><g data-step="3" data-caption="Replace the expanded calls with a result" data-hide="2"><rect x="40" y="145" width="100" height="40" rx="5" fill="var(--wash)"/><text x="90" y="170" text-anchor="middle">2 + 1 = 3</text></g></svg>
