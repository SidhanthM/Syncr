[package]
name = "syncr-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
name = "syncr_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = { version = "=0.32.2", default-features = false }
thiserror = "=2.0.18"
ulid = "=3.0.0"
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled", "backup"] }
fs2 = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
libc = "=0.2.191"

[dev-dependencies]
base64 = "=0.22.1"
tempfile = "=3.27.0"
